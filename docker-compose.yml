services:
  db:
    image: postgres:16-alpine
    container_name: harness_bmad_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: customers
    ports:
      - "5433:5432"
    volumes:
      - bmad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customers"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  bmad_pgdata:
